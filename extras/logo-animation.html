<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Editor 로고 애니메이션</title>
<style>
  html{height:100%}
  body{min-height:100%;margin:0;background:#efede7;display:flex;align-items:center;justify-content:center;overflow:hidden}
  svg{display:block;width:min(50vw, 100vh);height:auto;aspect-ratio:1734/492;overflow:visible}
  @media (max-width: 640px){ svg{width:min(68vw, 100vh)} }
</style>

<body>

<!-- 에디터 첫 화면에 들어가는 로고 애니메이션과 같은 것. 모든 도형은 벡터이고 이미지·영상·웹폰트 파일을 쓰지 않습니다.
     "Editor" 글자는 로고 이미지의 글자 모양을 재서 도형으로 그린 것입니다. -->
<svg id="logo" viewBox="0 0 1734 492" role="img" aria-label="MD Editor">
  <defs><path id="mdWord" fill="#30302e" d="M840.1 140.8L1002.2 140.8L1002.2 187.4L893.9 187.4L893.9 232L991.7 232L991.7 277.2L893.9 277.2L893.9 326.2L1005 326.2L1005 371.8L840.1 371.8ZM1148.8 131.1L1199 131.1L1199 371.7L1148.8 371.7L1148.8 352.6C1137.6 366.1 1119.6 374.7 1104.6 374.7C1056.9 374.7 1020.9 336.9 1020.9 286.8C1020.9 236.6 1056.9 198.8 1104.6 198.8C1119.6 198.8 1137.6 207.4 1148.8 220.9ZM1111.2 242.7C1088.8 242.7 1072.5 261.5 1072.5 287.4C1072.5 313.2 1088.8 332 1111.2 332C1133.6 332 1149.9 313.2 1149.9 287.4C1149.9 261.5 1133.6 242.7 1111.2 242.7ZM1231.3 202.3L1282.8 202.3L1282.8 371.8L1231.3 371.8ZM1257.3 124.9C1273 124.9 1285.8 137.6 1285.8 153.3C1285.8 168.9 1273 181.7 1257.3 181.7C1241.7 181.7 1228.9 168.9 1228.9 153.3C1228.9 137.6 1241.7 124.9 1257.3 124.9ZM1328.1 156.1L1378.8 156.1L1378.8 202.5L1415.3 202.5L1415.3 243L1378.8 243L1378.8 312.4C1378.8 323.4 1384.6 331.1 1395.6 331.2L1416.3 331.2L1416.3 370.2C1405.6 372.8 1393.6 374.2 1379.6 374.2C1349.6 374.2 1328.1 356.4 1328.1 322.4L1328.1 243L1304.2 243L1304.2 202.5L1328.1 202.5ZM1516.3 198.3C1566.6 198.3 1605.3 236.8 1605.3 286.7C1605.3 336.6 1566.6 375.1 1516.3 375.1C1466 375.1 1427.3 336.6 1427.3 286.7C1427.3 236.8 1466 198.3 1516.3 198.3ZM1516.4 242.6C1494.2 242.6 1478.1 261.4 1478.1 287.3C1478.1 313.2 1494.2 332 1516.4 332C1538.7 332 1554.8 313.2 1554.8 287.3C1554.8 261.4 1538.7 242.6 1516.4 242.6ZM1627.3 202.1L1677.7 202.1L1677.7 227.4C1683.6 212.4 1703.6 199 1729.6 199L1733.6 199L1733.6 247.3L1719.6 247.3C1697.6 247.3 1677.7 264.4 1677.7 292.4L1677.7 371.8L1627.3 371.8Z"/></defs>
  <defs><clipPath id="ilCut"><rect class="il-cut" x="-3000" y="0" width="9000" height="9000"/></clipPath></defs>
  <use class="il-word" href="#mdWord"/>
  <rect class="il-frame" width="715" height="492" rx="86" fill="#30302e"/>
  <g class="il-mark" fill="#fff" transform="translate(69.1 63.3) scale(.4383)">
    <path d="M0 0H170L371 402L297 546L140 244V831H0Z"/>
    <path d="M861 0H965A385 415.5 0 0 1 965 831H668V366L809 95V707H970A229 291 0 0 0 970 125H861Z"/>
    <line class="il-ink" x1="305" y1="795" x2="305" y2="795" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0"/>
    <g clip-path="url(#ilCut)">
      <g class="il-pen" transform="matrix(.88295 .46947 .46947 -.88295 305 795)">
        <path class="il-body" d="M-69 239V938H69V239Z"/>
        <path d="M-57 215H57L77 157L4.5 2V103.6A18 18 0 1 1 -4.5 103.6V2L-77 157Z"/>
      </g>
    </g>
  </g>
</svg>

<script>
(function(){
  'use strict';
  /* 로고 애니메이션
     펜이 올라와 있는 모습에서 시작 → 펜이 제자리로 내려옴 → 어두운 바탕이 배지 크기로 줄어들며 왼쪽으로 가고 "Editor" 가 배지 뒤에서 나옴.
     끝난 모습은 상단 로고와 똑같다. 좌표는 로고(가로 1734, 세로 492) 기준이고, MD 는 그 안에서 자체 좌표(가로 1350, 세로 831)를 쓴다. */
  function playLogo(svg, calm, onEnd){
    var q = function(c){ return svg.querySelector(c); };
    var frame = q('.il-frame'), mark = q('.il-mark'), pen = q('.il-pen'), body = q('.il-body'), ink = q('.il-ink'), cut = q('.il-cut'), word = q('.il-word');
    var AX = 0.46947, AY = -0.88295;          /* 펜대 방향 (세로에서 28도) */
    var TRAVEL = 390;                         /* 펜이 올라가 있는 거리 */
    var S1 = 0.4383, S0 = S1 * 1.6;           /* MD 크기: 처음(크게) → 끝 */
    var C0 = [867, 246], C1 = [364.95, 245.4];/* MD 가운데가 놓이는 자리: 화면 가운데 → 배지 안 */
    var F0 = 1450;                            /* 처음의 어두운 바탕(정사각형) 한 변 */
    var HOLD = 0.2, DOWN = 0.78, TUCK = 0.98, MOVE = 1.05, PAN = 1.85, END = 2.05, DUR = 2.1;   /* 시간표(초) */
    var clamp = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; };
    var seg = function(t, a, b){ return clamp((t - a) / (b - a)); };
    var inOut = function(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
    var soft = function(x){ return Math.pow(Math.sin(x * Math.PI / 2), 1.3); };
    var lerp = function(a, b, k){ return a + (b - a) * k; };
    var n = function(v){ return Math.round(v * 100) / 100; };
    function draw(t){
      /* 펜: 잠깐 머물렀다가 내려오고, 다 내려오면 윗부분이 글자 높이에 맞춰 가려짐 */
      var up = 1 - inOut(seg(t, HOLD, DOWN));
      var open = 1 - inOut(seg(t, DOWN - 0.06, TUCK));
      var s = TRAVEL * up, tx = 305 + AX * s, ty = 795 + AY * s, L = 938 - 45 * up;
      pen.setAttribute('transform', 'matrix(.88295 .46947 .46947 -.88295 ' + n(tx) + ' ' + n(ty) + ')');
      body.setAttribute('d', 'M-69 239V' + n(L) + 'C-66 ' + n(L + 26) + ' 66 ' + n(L + 26) + ' 69 ' + n(L) + 'V239Z');
      cut.setAttribute('y', open >= 1 ? -5000 : n(-115 * open));
      if(s > 6){ ink.setAttribute('x2', n(tx - AX * 4)); ink.setAttribute('y2', n(ty - AY * 4)); ink.setAttribute('opacity', 1); }
      else ink.setAttribute('opacity', 0);
      /* 바탕이 배지로 줄어들고 MD 가 제자리로 */
      var z = soft(seg(t, MOVE, END)), pn = soft(seg(t, MOVE, PAN));
      var sc = lerp(S0, S1, z), cx = lerp(C0[0], C1[0], pn), cy = lerp(C0[1], C1[1], z);
      mark.setAttribute('transform', 'translate(' + n(cx - 675 * sc) + ' ' + n(cy - 415.5 * sc) + ') scale(' + Math.round(sc * 1e5) / 1e5 + ')');
      var fw = lerp(F0, 715, z), fh = lerp(F0, 492, z), fx = cx - 7.45 * pn - fw / 2, fy = cy + 0.6 * z - fh / 2;
      frame.setAttribute('x', n(fx)); frame.setAttribute('y', n(fy)); frame.setAttribute('width', n(fw)); frame.setAttribute('height', n(fh)); frame.setAttribute('rx', n(lerp(165, 86, z)));
      /* "Editor": 배지 뒤에서 오른쪽으로 나옴 */
      var w = seg(t, MOVE + 0.38, END), wk = 1 - Math.pow(1 - w, 3);
      word.setAttribute('opacity', n(seg(t, MOVE + 0.38, MOVE + 0.7)));
      word.setAttribute('transform', 'translate(' + n(-150 * (1 - wk)) + ' 0)');
    }
    svg.mdDraw = draw;     /* 특정 시점의 모습을 그려 보는 손잡이 (확인용) */
    if(calm || !window.requestAnimationFrame){ draw(DUR); onEnd(); return; }
    /* 흐른 시간을 프레임마다 더해 가되 한 번에 0.05초까지만 인정: 페이지를 불러오느라 잠깐 멈춰도 장면을 건너뛰지 않고 이어서 보여 줌 */
    var last = null, t = 0;
    function tick(now){
      if(last !== null) t = Math.min(DUR, t + Math.min(0.05, (now - last) / 1000));
      last = now;
      draw(t);
      if(t < DUR) requestAnimationFrame(tick); else onEnd();
    }
    draw(0);
    requestAnimationFrame(tick);
  }

  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var q = (location.search.match(/[?&]t=([0-9.]+)/) || [])[1];
  var logo = document.getElementById('logo');
  playLogo(logo, calm || q != null, function(){});
  if(q != null) logo.mdDraw(+q);     /* 주소 끝에 ?t=1.2 → 그 시점에서 멈춘 화면 (확인용) */
})();
</script>
</body>
</html>
